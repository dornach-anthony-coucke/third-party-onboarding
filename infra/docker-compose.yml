services:
  third-party-onboarding-database:
    image: postgres:16-alpine
    container_name: third-party-onboarding-database
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: third-party-onboarding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
