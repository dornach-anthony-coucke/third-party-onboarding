name: Build and publish app docker image(s) on dev

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  publish-dev-app-images:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title != 'Version Packages' &&
      github.event.pull_request.head.ref != 'changeset-release/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changesets
        id: changesets
        shell: bash
        run: |
          COUNT=$(git ls-files .changeset/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "Nombre de changesets détectés: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop early if no changesets
        if: steps.changesets.outputs.skip_build == 'true'
        run: echo "Skipping Docker build for apps (no changeset present)."

      - name: Version snapshot for apps (prefix 'dev')
        if: steps.changesets.outputs.skip_build == 'false'
        run: pnpm changeset version --snapshot "dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed app package.json files
        id: changed_apps
        shell: bash
        run: |
          CHANGED_APPS=$(git diff --name-only | grep '^apps/.*/package.json' || true)
          if [ -z "$CHANGED_APPS" ]; then
            echo "No app package.json changed by snapshot; skipping Docker builds."
            echo "has_changed_apps=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed app package.json files:"
            echo "$CHANGED_APPS"
            CHANGED_APPS_ONE_LINE=$(echo "$CHANGED_APPS" | tr '\n' ' ')
            echo "has_changed_apps=true" >> "$GITHUB_OUTPUT"
            echo "files=$CHANGED_APPS_ONE_LINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push dev app images
        if: steps.changed_apps.outputs.has_changed_apps == 'true'
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          for PKG_FILE in ${{ steps.changed_apps.outputs.files }}; do
            APP_DIR=$(dirname "$PKG_FILE")
            PKG_NAME=$(node -p "require('./$PKG_FILE').name")
            VERSION=$(node -p "require('./$PKG_FILE').version")
            IMAGE_BASENAME=$(echo "$PKG_NAME" | sed 's/^@//; s/\//-/g')
            IMAGE_NAME="ghcr.io/$OWNER/$IMAGE_BASENAME"

            echo "Building $IMAGE_NAME:$VERSION from $APP_DIR"

            docker buildx build \
              --file "$APP_DIR/Dockerfile" \
              --tag "$IMAGE_NAME:$VERSION" \
              --tag "$IMAGE_NAME:dev-pr-${{ github.event.pull_request.number }}" \
              --tag "$IMAGE_NAME:dev-${{ github.sha }}" \
              --push \
              .
          done
