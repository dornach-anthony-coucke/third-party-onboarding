name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Nx SHAs for affected detection
        uses: nrwl/nx-set-shas@v4

      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3

      - name: Format check
        run: pnpm run format:check

      - name: Build packages (affected)
        run: pnpm nx affected -t build --parallel=3

      - name: Run tests (affected)
        run: pnpm nx affected -t test --parallel=3
