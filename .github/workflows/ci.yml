name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

jobs:
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Nx SHAs for affected detection
        uses: nrwl/nx-set-shas@v4
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          main-branch-name: main

      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3

      - name: Format check
        run: pnpm run format:check

  build:
    name: Build (affected)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Nx SHAs for affected detection
        uses: nrwl/nx-set-shas@v4
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          main-branch-name: main

      - name: Build (affected)
        run: pnpm nx affected -t build --parallel=3

  test:
    name: Test (affected)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Nx SHAs for affected detection
        uses: nrwl/nx-set-shas@v4
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          main-branch-name: main

      - name: Run tests (affected)
        run: pnpm nx affected -t test --parallel=3
